name: Build and Deploy LaTeX to GitHub Pages
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - name: Prepare file for Pages
        run: |
          mkdir public
          mv resume.pdf public/index.pdf
          # Create an index.html that redirects to the PDF
          echo '<meta http-equiv="refresh" content="0; URL=index.pdf">' > public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
