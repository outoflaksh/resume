name: Build and Deploy LaTeX to GitHub Pages
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex # 📄 Change this if your main file has a different name

      - name: Prepare file for Pages
        run: |
          mkdir public
          mv main.pdf public/index.pdf # 📁 Moves your PDF to a folder for deployment

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
